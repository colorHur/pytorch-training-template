name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      # 两个 action 都升到 Node 24 一代：GitHub 会对 target Node 20 的 action
      # 在每次运行打一条 deprecation 注解，绿跑看起来也不干净。
      # （checkout 最新是 v7，v7 的变更是 fork PR 的安全策略，本工作流用不到。）
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（CPU 版 torch）
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: lint
        run: ruff check src experiments tests tools

      - name: 跑测试
        # 强制走 CPU 路径：CI 机器没有 GPU，同时也顺带验证「无 CUDA 也能跑」
        # 也顺带验证 gloo 后端下的 DDP（多进程测试用 FileStore 做 rendezvous，
        # 不依赖 TCPStore）
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest tests/ -v --durations=10
