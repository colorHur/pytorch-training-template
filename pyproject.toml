[tool.ruff]
target-version = "py311"
line-length = 100

# 只启用"能抓真 bug"的规则，不做风格绑架。
#   F  = pyflakes：未使用的导入/变量、未定义的名字、f-string 没占位符
#   E9 = 语法与运行时错误（如语法错误、裸 except 的写法问题）
#   I  = import 排序（低争议，且能防循环导入）
# 特意**不启用**全套默认规则：像"zip 换成 itertools.pairwise"这类偏好
# 会让模板代码充满无意义的改动，反而不好读。
[tool.ruff.lint]
select = ["F", "E9", "I"]

[tool.ruff.lint.per-file-ignores]
# __init__.py 里常常需要"导入即注册"的写法
"src/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
